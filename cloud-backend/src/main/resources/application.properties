# ==========================================
# Application Configuration & .env Imports
# ==========================================
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.application.name=cloud-backend
server.port=${PORT:8080}

# ==========================================
# Database Configuration (PostgreSQL)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.cloudBackend=DEBUG

# ==========================================
# JWT Security Configuration (24-hour expiration)
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# ==========================================
# Google OAuth 2.0 & Drive API Configuration
# ==========================================
google.oauth.client-id=${GOOGLE_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI}
google.oauth.frontend-url=${FRONTEND_URL}

# ==========================================
# File Upload Configuration (Up to 500MB)
# ==========================================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
